name: Deploy Localization Bundle to Firebase

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'Target Locale Code (e.g. es, th, fr)'
        required: true
        default: 'es'
        type: choice
        options:
          - es
          - th
          - fr
          - en
      version:
        description: 'Semantic Version String'
        required: true
        default: '1.1.0'
        type: string
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      actor:
        description: 'Publishing Actor'
        required: false
        default: 'admin'
        type: string

jobs:
  publish-release:
    name: Compile & Publish Localization Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Compile & Publish Release Bundle
        run: |
          python3 scripts/publisher.py \
            --locale "${{ github.event.inputs.locale }}" \
            --version "${{ github.event.inputs.version }}" \
            --env "${{ github.event.inputs.environment }}" \
            --actor "${{ github.event.inputs.actor || github.actor }}"

      - name: Export Native Mobile Fallbacks
        run: |
          python3 scripts/export_fallbacks.py --platform all

      - name: Commit Release Staging & Fallbacks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translation-store/releases/
          git commit -m "chore(release): publish ${{ github.event.inputs.locale }} v${{ github.event.inputs.version }} to ${{ github.event.inputs.environment }}" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
